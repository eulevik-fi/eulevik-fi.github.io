<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aerial for Windows</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f9fc;
      color: #1a1a1a;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Hero */
    .hero {
      position: relative;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 48px 80px;
      text-align: center;
    }

    .hero-bg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1100px;
      height: 520px;
      background: linear-gradient(135deg, rgba(200, 220, 255, 0.35) 0%, rgba(180, 230, 210, 0.25) 50%, rgba(220, 240, 255, 0.2) 100%);
      border-radius: 24px;
      z-index: 0;
      overflow: hidden;
    }

    .hero-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.4) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(180, 220, 200, 0.3) 0%, transparent 40%);
      pointer-events: none;
    }

    .monitor-wrapper {
      position: relative;
      z-index: 2;
      display: inline-block;
      margin-bottom: 0px; /* was 48px */
    }

    .monitor {
      width: 720px;
      max-width: 90vw;
      height: auto;
      display: block;
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.18));
    }

    /* Content */
    .label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #1a6b4a;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(36px, 5.5vw, 64px);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #111;
      max-width: 900px;
      margin: 0 auto 24px;
    }

    h1 .green {
      color: #1a6b4a;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.5;
      color: #444;
      max-width: 520px;
      margin: 0 auto 36px;
    }

    .cta {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-decoration: none;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero {
        padding: 24px 20px 60px;
      }

      .hero-bg {
        height: 360px;
      }

      .monitor {
        width: 100%;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="hero-bg"></div>

    <div class="monitor-wrapper">
      <img src="AerialSmall.png" alt="Aerial landscape on monitor" class="monitor">
    </div>

    <p class="label">AERIAL FOR WINDOWS</p>
    <h1>
      Windows Screen Saver<br>
      for <span class="green">Apple aerial videos.</span>
    </h1>
    <p class="subtitle">
      Enjoy breathtaking, high-definition 4K aerial flyovers on your PC.
    </p>
    <a href="https://github.com/eulevik-fi/aerial/releases/download/1.1.0/Install.Aerial.Screen.Saver.1.1.0.msi" class="cta">GET STARTED</a>
  </main>
</body>
</html>
